# RevenueCat catalog source of truth for PhysiLog.
#
# Secret API keys must not be stored in this file. Pass a RevenueCat API v2
# secret key through REVENUECAT_API_KEY when applying changes.
#
# Notes:
# - prod is the existing RevenueCat project "Physilog".
# - dev is the RevenueCat project "Physilog Dev" with a Test Store app.
# - JPY prices are the intended store prices from PR #75. RevenueCat Test Store
#   product creation API currently does not expose a currency/price field, so
#   the sync script keeps these as metadata/documentation and only sends fields
#   accepted by the RevenueCat API v2 product endpoint.

environments:
  dev:
    project_id: b9208054
    apps:
      test_store:
        app_id: app4d5c71b3b2
        store: test_store
      ios:
        app_id: appf453300e51
        store: app_store
      android:
        app_id: appbbd1f7da16
        store: play_store
  prod:
    project_id: ec10fe6b
    apps:
      ios:
        app_id: appcf636b29a7
        store: app_store
      android:
        app_id: app07c4ac722f
        store: play_store

entitlements:
  - id: personal_family
    display_name: Personal Family
  - id: team
    display_name: Team

products:
  - id: personal_family_monthly
    display_name: Personal Family Monthly
    title: Personal Family Monthly
    type: subscription
    duration: P1M
    entitlement_id: personal_family
    intended_price:
      currency: JPY
      amount: 100
    store_products:
      dev:
        - app: test_store
          store_identifier: personal_family_monthly
        - app: ios
          store_identifier: com.inoworl.physilog.dev.personal_family.monthly
        - app: android
          store_identifier: personal_family:monthly
      prod:
        - app: ios
          store_identifier: com.inoworl.physilog.personal_family.monthly
        - app: android
          store_identifier: personal_family:monthly

  - id: personal_family_yearly
    display_name: Personal Family Yearly
    title: Personal Family Yearly
    type: subscription
    duration: P1Y
    entitlement_id: personal_family
    intended_price:
      currency: JPY
      amount: 1000
    store_products:
      dev:
        - app: test_store
          store_identifier: personal_family_yearly
        - app: ios
          store_identifier: com.inoworl.physilog.dev.personal_family.yearly
        - app: android
          store_identifier: personal_family:yearly
      prod:
        - app: ios
          store_identifier: com.inoworl.physilog.personal_family.yearly
        - app: android
          store_identifier: personal_family:yearly

  - id: team_monthly
    display_name: Team Monthly
    title: Team Monthly
    type: subscription
    duration: P1M
    entitlement_id: team
    intended_price:
      currency: JPY
      amount: 980
    manual_setup:
      trial: 1 month free trial
    store_products:
      dev:
        - app: test_store
          store_identifier: team_monthly
        - app: ios
          store_identifier: com.inoworl.physilog.dev.team.monthly
        - app: android
          store_identifier: team:monthly
      prod:
        - app: ios
          store_identifier: com.inoworl.physilog.team.monthly
        - app: android
          store_identifier: team:monthly

  - id: team_yearly
    display_name: Team Yearly
    title: Team Yearly
    type: subscription
    duration: P1Y
    entitlement_id: team
    intended_price:
      currency: JPY
      amount: 8980
    manual_setup:
      trial: 1 month free trial
    store_products:
      dev:
        - app: test_store
          store_identifier: team_yearly
        - app: ios
          store_identifier: com.inoworl.physilog.dev.team.yearly
        - app: android
          store_identifier: team:yearly
      prod:
        - app: ios
          store_identifier: com.inoworl.physilog.team.yearly
        - app: android
          store_identifier: team:yearly

offering:
  id: default
  display_name: Default
  current: true
  packages:
    - id: personal_family_monthly
      display_name: Personal Family Monthly
      product_id: personal_family_monthly
      position: 1
    - id: personal_family_yearly
      display_name: Personal Family Yearly
      product_id: personal_family_yearly
      position: 2
    - id: team_monthly
      display_name: Team Monthly
      product_id: team_monthly
      position: 3
    - id: team_yearly
      display_name: Team Yearly
      product_id: team_yearly
      position: 4

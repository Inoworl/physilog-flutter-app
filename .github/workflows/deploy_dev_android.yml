name: "[Release] Dev Android"

on:
  workflow_dispatch:

concurrency:
  group: release-dev-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CI
        uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Firebase config
        env:
          DEV_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.DEV_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$DEV_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "DEV_GOOGLE_SERVICES_JSON_BASE64 is required" >&2
            exit 1
          fi
          mkdir -p android/app/src/dev
          echo "$DEV_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/src/dev/google-services.json

      - name: Restore dart defines
        env:
          DEV_DART_DEFINE_JSON_BASE64: ${{ secrets.DEV_DART_DEFINE_JSON_BASE64 }}
        run: |
          if [ -n "$DEV_DART_DEFINE_JSON_BASE64" ]; then
            echo "$DEV_DART_DEFINE_JSON_BASE64" | base64 --decode > dart_define/dev_dart_define.json
          fi

      - name: Restore Android upload signing
        env:
          ANDROID_UPLOAD_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_JKS_BASE64" ] || [ -z "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_UPLOAD_KEY_ALIAS" ] || [ -z "$ANDROID_UPLOAD_KEY_PASSWORD" ]; then
            echo "Android upload signing secrets are required" >&2
            exit 1
          fi
          echo "$ANDROID_UPLOAD_KEYSTORE_JKS_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_UPLOAD_KEY_ALIAS"
            echo "keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD"
          } > android/key.properties

      - name: Generate code (freezed/json/riverpod)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Calculate build number
        id: calculate_build_number
        run: |
          build_number=$(date +%s)
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Build dev Android App Bundle
        run: |
          flutter build appbundle --release \
            --flavor dev \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define-from-file=dart_define/dev_dart_define.json \
            --build-number="${{ steps.calculate_build_number.outputs.build_number }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-aab-${{ github.run_id }}
          path: build/app/outputs/bundle/devRelease/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Restore Google Play service account
        env:
          GOOGLE_PLAY_CONSOLE_API_SERVICE_ACCOUNT_KEY_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_CONSOLE_API_SERVICE_ACCOUNT_KEY_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_PLAY_CONSOLE_API_SERVICE_ACCOUNT_KEY_JSON_BASE64" ]; then
            echo "GOOGLE_PLAY_CONSOLE_API_SERVICE_ACCOUNT_KEY_JSON_BASE64 is required" >&2
            exit 1
          fi
          echo "$GOOGLE_PLAY_CONSOLE_API_SERVICE_ACCOUNT_KEY_JSON_BASE64" | base64 --decode > /tmp/google_play_service_account.json

      - name: Upload dev AAB to Google Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/google_play_service_account.json
          packageName: ${{ secrets.DEV_ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/devRelease/*.aab
          track: internal
          status: completed

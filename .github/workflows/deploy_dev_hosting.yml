name: "[Release] Dev Hosting"

on:
  push:
    branches: [dev]
    paths:
      - docs/pages/**
      - firebase.json
      - .github/workflows/deploy_dev_hosting.yml
  workflow_dispatch:

concurrency:
  group: hosting-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev

    steps:
      - uses: actions/checkout@v5.0.1

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          DEV_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "$DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only hosting --project "$DEV_FIREBASE_PROJECT_ID"

name: "[Release] Prod Android"

on:
  workflow_dispatch:

concurrency:
  group: release-prod-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CI
        uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Restore Firebase Android config
        env:
          PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          PROD_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          PROD_FIREBASE_ANDROID_APP_ID: ${{ secrets.PROD_FIREBASE_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/prod
          echo "$PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase apps:sdkconfig ANDROID "$PROD_FIREBASE_ANDROID_APP_ID" \
            --project "$PROD_FIREBASE_PROJECT_ID" \
            --out android/app/src/prod/google-services.json

      - name: Generate prod launcher icons
        run: |
          dart run tool/generate_flavor_icon.dart prod
          dart run flutter_launcher_icons -f flutter_launcher_icons-prod.yaml

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Validate Android signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error ::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Restore Android signing keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_UPLOAD_KEYSTORE_JKS_BASE64" | base64 --decode > android/upload-keystore.jks
          if [ ! -s android/upload-keystore.jks ]; then
            echo "::error ::Decoded keystore is empty. Check ANDROID_UPLOAD_KEYSTORE_JKS_BASE64."
            exit 1
          fi

      - name: Create Android key.properties
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Calculate build number
        id: calculate_build_number
        run: echo "build_number=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build Android App Bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --flavor prod \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define-from-file=dart_define/prod_dart_define.json \
            -t lib/main.dart \
            --build-name="$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)" \
            --build-number="${{ steps.calculate_build_number.outputs.build_number }}"

      - name: Build Android APK
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --flavor prod \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define-from-file=dart_define/prod_dart_define.json \
            -t lib/main.dart \
            --build-name="$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)" \
            --build-number="${{ steps.calculate_build_number.outputs.build_number }}"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-prod-apk-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-prod-aab-${{ github.run_id }}
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Collect release notes
        run: echo "LATEST_COMMIT_MESSAGES=$(git log -n 10 --pretty=format:'%s' | tr '\n' '; ')" >> "$GITHUB_ENV"

      - name: Deploy to Firebase App Distribution
        env:
          PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          PROD_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          PROD_FIREBASE_ANDROID_APP_ID: ${{ secrets.PROD_FIREBASE_ANDROID_APP_ID }}
          PROD_ANDROID_PACKAGE_NAME: ${{ secrets.PROD_ANDROID_PACKAGE_NAME }}
        run: |
          set -euo pipefail
          echo "$PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase use --project "$PROD_FIREBASE_PROJECT_ID"
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-prod-release.apk \
            --app "$PROD_FIREBASE_ANDROID_APP_ID" \
            --groups internal-testers \
            --release-notes "${LATEST_COMMIT_MESSAGES}"

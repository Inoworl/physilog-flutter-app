name: PR Tests

on:
  pull_request:
    branches: [dev, main]

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1

      - name: Setup Flutter
        uses: ./.github/actions/setup

      - name: Restore Firebase options
        env:
          APP_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.APP_FIREBASE_OPTIONS_DART_BASE64 }}
          DEV_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.DEV_FIREBASE_OPTIONS_DART_BASE64 }}
          PROD_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.PROD_FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_FIREBASE_OPTIONS_DART_BASE64 DEV_FIREBASE_OPTIONS_DART_BASE64 PROD_FIREBASE_OPTIONS_DART_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error ::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "$APP_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$DEV_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options_dev.dart
          echo "$PROD_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options_prod.dart

      - name: Check formatting
        run: git ls-files '*.dart' ':!:lib/firebase_options*.dart' | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze project source
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter analyze --no-fatal-infos

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1

      - name: Setup Flutter
        uses: ./.github/actions/setup

      - name: Restore Firebase options
        env:
          APP_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.APP_FIREBASE_OPTIONS_DART_BASE64 }}
          DEV_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.DEV_FIREBASE_OPTIONS_DART_BASE64 }}
          PROD_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.PROD_FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_FIREBASE_OPTIONS_DART_BASE64 DEV_FIREBASE_OPTIONS_DART_BASE64 PROD_FIREBASE_OPTIONS_DART_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error ::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "$APP_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$DEV_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options_dev.dart
          echo "$PROD_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options_prod.dart

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --dart-define=FLUTTER_TEST=true

  ci_success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [analyze, test]
    if: always()

    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.analyze.result }}" == "success" && "${{ needs.test.result }}" == "success" ]]; then
            echo "All CI checks passed"
          else
            echo "CI checks failed"
            echo "Analyze: ${{ needs.analyze.result }}"
            echo "Test: ${{ needs.test.result }}"
            exit 1
          fi

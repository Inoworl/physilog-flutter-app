name: "[Release] Prod iOS"

on:
  workflow_dispatch:

concurrency:
  group: release-prod-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    environment: prod

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CI
        uses: ./.github/actions/setup

      - name: Restore Firebase config
        env:
          PROD_GOOGLESERVICE_INFO_PLIST_BASE64: ${{ secrets.PROD_GOOGLESERVICE_INFO_PLIST_BASE64 }}
          APP_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.APP_FIREBASE_OPTIONS_DART_BASE64 }}
          DEV_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.DEV_FIREBASE_OPTIONS_DART_BASE64 }}
          PROD_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.PROD_FIREBASE_OPTIONS_DART_BASE64 }}
          PROD_DART_DEFINE_JSON_BASE64: ${{ secrets.PROD_DART_DEFINE_JSON_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in PROD_GOOGLESERVICE_INFO_PLIST_BASE64 APP_FIREBASE_OPTIONS_DART_BASE64 DEV_FIREBASE_OPTIONS_DART_BASE64 PROD_FIREBASE_OPTIONS_DART_BASE64 PROD_DART_DEFINE_JSON_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error ::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          mkdir -p ios/Runner/Firebase/prod dart_define
          echo "$PROD_GOOGLESERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/Firebase/prod/GoogleService-Info.plist
          echo "$APP_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$DEV_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options_dev.dart
          echo "$PROD_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options_prod.dart
          echo "$PROD_DART_DEFINE_JSON_BASE64" | base64 --decode > dart_define/prod_dart_define.json

      - name: Import Code Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}

      - name: Generate code (freezed/json/riverpod)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Check build tools
        run: |
          fastlane --version
          xcodebuild -version

      - name: Deploy with fastlane (prod)
        env:
          IOS_CERTIFICATES_P12_BASE64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          IOS_CERTIFICATES_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}
          PROD_PROVISIONING_PROFILE_BASE64: ${{ secrets.PROD_PROVISIONING_PROFILE_BASE64 }}
          PROD_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROD_PROVISIONING_PROFILE_SPECIFIER }}
          DEVELOPMENT_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          PROD_TESTFLIGHT_WHATS_NEW_JA: ${{ secrets.PROD_TESTFLIGHT_WHATS_NEW_JA }}
          FASTLANE_DISABLE_PTY: 1
          FASTLANE_EXPLICIT_OPEN3: 1
          FASTLANE_DISABLE_COLORS: 1
          CI: 1
        run: |
          cd ios
          fastlane prod

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-prod-ipa-${{ github.run_id }}
          path: ios/build/*.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Redact iOS build logs
        id: redact_ios_build_logs
        if: always()
        run: |
          ruby ios/fastlane/dart_define_log_redaction.rb \
            dart_define/prod_dart_define.json \
            "$HOME/Library/Logs/gym/*.log" \
            "ios/build/logs/**/*.log"

      - name: Show redacted iOS build logs
        if: failure() && steps.redact_ios_build_logs.outcome == 'success'
        run: |
          shopt -s globstar nullglob
          for log in "$HOME"/Library/Logs/gym/*.log ios/build/logs/**/*.log; do
            tail -n 200 "$log"
          done

      - name: Upload build logs
        if: failure() && steps.redact_ios_build_logs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prod-build-logs-${{ github.run_id }}
          path: |
            /Users/runner/Library/Logs/gym/*.log
            ios/build/logs/**/*.log
          retention-days: 7

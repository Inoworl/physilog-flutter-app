name: "[Release] Dev iOS"

on:
  workflow_dispatch:

concurrency:
  group: release-dev-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    environment: dev

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CI
        uses: ./.github/actions/setup

      - name: Restore Firebase config (optional)
        env:
          DEV_GOOGLESERVICE_INFO_PLIST_BASE64: ${{ secrets.DEV_GOOGLESERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$DEV_GOOGLESERVICE_INFO_PLIST_BASE64" ]; then
            mkdir -p ios/Runner/Firebase/dev
            echo "$DEV_GOOGLESERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/Firebase/dev/GoogleService-Info.plist
            echo "Restored GoogleService-Info.plist"
          else
            echo "DEV_GOOGLESERVICE_INFO_PLIST_BASE64 is empty; skip restore."
          fi

      - name: Import Code Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}

      - name: Generate code (freezed/json/riverpod)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Check build tools
        run: |
          fastlane --version
          xcodebuild -version

      - name: Deploy with fastlane (dev)
        env:
          IOS_CERTIFICATES_P12_BASE64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          IOS_CERTIFICATES_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}
          DEV_PROVISIONING_PROFILE_BASE64: ${{ secrets.DEV_PROVISIONING_PROFILE_BASE64 }}
          DEV_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.DEV_PROVISIONING_PROFILE_SPECIFIER }}
          DEVELOPMENT_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          DEV_TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.DEV_TESTFLIGHT_EXTERNAL_GROUPS }}
          DEV_TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS: ${{ secrets.DEV_TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS }}
          DEV_TESTFLIGHT_BETA_APP_DESCRIPTION: ${{ secrets.DEV_TESTFLIGHT_BETA_APP_DESCRIPTION }}
          DEV_TESTFLIGHT_WHATS_NEW_JA: ${{ secrets.DEV_TESTFLIGHT_WHATS_NEW_JA }}
          DEV_TESTFLIGHT_FEEDBACK_EMAIL: ${{ secrets.DEV_TESTFLIGHT_FEEDBACK_EMAIL }}
          DEV_TESTFLIGHT_CONTACT_FIRST_NAME: ${{ secrets.DEV_TESTFLIGHT_CONTACT_FIRST_NAME }}
          DEV_TESTFLIGHT_CONTACT_LAST_NAME: ${{ secrets.DEV_TESTFLIGHT_CONTACT_LAST_NAME }}
          DEV_TESTFLIGHT_CONTACT_EMAIL: ${{ secrets.DEV_TESTFLIGHT_CONTACT_EMAIL }}
          DEV_TESTFLIGHT_CONTACT_PHONE_E164: ${{ secrets.DEV_TESTFLIGHT_CONTACT_PHONE_E164 }}
          DEV_TESTFLIGHT_EXTERNAL_TESTER_EMAIL: ${{ secrets.DEV_TESTFLIGHT_EXTERNAL_TESTER_EMAIL }}
          DEV_TESTFLIGHT_EXTERNAL_TESTER_FIRST_NAME: ${{ secrets.DEV_TESTFLIGHT_EXTERNAL_TESTER_FIRST_NAME }}
          DEV_TESTFLIGHT_EXTERNAL_TESTER_LAST_NAME: ${{ secrets.DEV_TESTFLIGHT_EXTERNAL_TESTER_LAST_NAME }}
          FASTLANE_DISABLE_PTY: 1
          FASTLANE_EXPLICIT_OPEN3: 1
          FASTLANE_DISABLE_COLORS: 1
          CI: 1
        run: |
          cd ios
          fastlane dev

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-ipa-${{ github.run_id }}
          path: ios/build/*.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Debug build settings on failure
        if: failure()
        run: |
          echo "=== Xcode Build Settings Debug ==="
          cd ios
          xcodebuild -showBuildSettings -workspace Runner.xcworkspace -scheme dev -configuration Release-dev | tail -n 80 || true
          echo "=== Gym Log Tail ==="
          tail -n 200 /Users/runner/Library/Logs/gym/*.log || true
          echo "=== Build Logs Directory ==="
          ls -la ./build/logs/ || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            /Users/runner/Library/Logs/gym/*.log
            ios/build/logs/
          retention-days: 7

name: "[Release] Dev iOS"

on:
  workflow_dispatch:

concurrency:
  group: release-dev-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    environment: dev

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CI
        uses: ./.github/actions/setup

      - name: Restore Firebase config (optional)
        if: ${{ secrets.DEV_GOOGLESERVICE_INFO_PLIST_BASE64 != '' }}
        run: |
          echo "${{ secrets.DEV_GOOGLESERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Import Provisioning Profile
        run: |
          echo "${{ secrets.DEV_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > dev.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp dev.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/dev.mobileprovision
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/dev.mobileprovision > /dev/null

      - name: Import Code Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}

      - name: Verify certificates
        run: |
          security find-identity -v -p codesigning
          xcodebuild -version

      - name: Calculate build number
        id: calculate_build_number
        run: |
          TOTAL_COMMITS=$(git rev-list --all --count)
          TOTAL_COMMITS=$((TOTAL_COMMITS + 20000))
          echo "buildNumber=$TOTAL_COMMITS" >> "$GITHUB_OUTPUT"

      - name: Prepare Xcode signing overrides
        run: |
          cat > ios/Flutter/Dart-Defines.xcconfig <<EOF
          PROVISIONING_PROFILE_SPECIFIER = ${{ secrets.DEV_PROVISIONING_PROFILE_SPECIFIER }}
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${{ secrets.DEVELOPMENT_TEAM_ID }}
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.DEVELOPMENT_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.physilog.physiLog.dev</key>
              <string>${{ secrets.DEV_PROVISIONING_PROFILE_SPECIFIER }}</string>
            </dict>
          </dict>
          </plist>
          EOF

          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER = /d' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' '/CODE_SIGN_STYLE = /d' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' '/DEVELOPMENT_TEAM = /d' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' '/CODE_SIGN_IDENTITY = /d' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' '/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = /d' ios/Runner.xcodeproj/project.pbxproj

      - name: Build IPA (dev)
        run: |
          flutter build ipa --release \
            --flavor dev \
            --target lib/main.dart \
            --dart-define-from-file=dart_define/dev_dart_define.json \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name=$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1) \
            --build-number="${{ steps.calculate_build_number.outputs.buildNumber }}"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-ipa-${{ github.run_id }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Upload to TestFlight
        run: |
          IPA_FILE=$(ls ./build/ios/ipa/*.ipa)
          xcrun altool --upload-app \
            -t ios \
            -f "$IPA_FILE" \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APP_SPECIFIC_PASSWORD }}"

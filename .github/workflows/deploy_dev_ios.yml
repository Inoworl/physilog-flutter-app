name: "[Release] Dev iOS"

on:
  workflow_dispatch:

concurrency:
  group: release-dev-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    environment: dev

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CI
        uses: ./.github/actions/setup

      - name: Restore Firebase config files
        env:
          DEV_GOOGLESERVICE_INFO_PLIST_BASE64: ${{ secrets.DEV_GOOGLESERVICE_INFO_PLIST_BASE64 }}
          APP_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.APP_FIREBASE_OPTIONS_DART_BASE64 }}
          DEV_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.DEV_FIREBASE_OPTIONS_DART_BASE64 }}
          PROD_FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.PROD_FIREBASE_OPTIONS_DART_BASE64 }}
          DEV_DART_DEFINE_JSON_BASE64: ${{ secrets.DEV_DART_DEFINE_JSON_BASE64 }}
          REVENUECAT_DEV_IOS_API_KEY: ${{ secrets.REVENUECAT_DEV_IOS_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEV_GOOGLESERVICE_INFO_PLIST_BASE64 APP_FIREBASE_OPTIONS_DART_BASE64 DEV_FIREBASE_OPTIONS_DART_BASE64 PROD_FIREBASE_OPTIONS_DART_BASE64 DEV_DART_DEFINE_JSON_BASE64 REVENUECAT_DEV_IOS_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error ::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          mkdir -p ios/Runner/Firebase/dev dart_define
          echo "$DEV_GOOGLESERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/Firebase/dev/GoogleService-Info.plist
          echo "$APP_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$DEV_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options_dev.dart
          echo "$PROD_FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options_prod.dart
          echo "$DEV_DART_DEFINE_JSON_BASE64" | base64 --decode > dart_define/dev_dart_define.json
          ruby -rjson -e 'path = "dart_define/dev_dart_define.json"; data = JSON.parse(File.read(path)); data["REVENUECAT_IOS_API_KEY"] = ENV.fetch("REVENUECAT_DEV_IOS_API_KEY"); File.write(path, JSON.pretty_generate(data))'

      - name: Import Code Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}

      - name: Generate code (freezed/json/riverpod)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Check build tools
        run: |
          fastlane --version
          xcodebuild -version

      - name: Deploy with fastlane (dev)
        env:
          IOS_CERTIFICATES_P12_BASE64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          IOS_CERTIFICATES_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}
          DEV_PROVISIONING_PROFILE_BASE64: ${{ secrets.DEV_PROVISIONING_PROFILE_BASE64 }}
          DEV_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.DEV_PROVISIONING_PROFILE_SPECIFIER }}
          DEVELOPMENT_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          DEV_TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.DEV_TESTFLIGHT_EXTERNAL_GROUPS }}
          DEV_TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS: ${{ secrets.DEV_TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS }}
          DEV_TESTFLIGHT_BETA_APP_DESCRIPTION: ${{ secrets.DEV_TESTFLIGHT_BETA_APP_DESCRIPTION }}
          DEV_TESTFLIGHT_WHATS_NEW_JA: ${{ secrets.DEV_TESTFLIGHT_WHATS_NEW_JA }}
          DEV_TESTFLIGHT_FEEDBACK_EMAIL: ${{ secrets.DEV_TESTFLIGHT_FEEDBACK_EMAIL }}
          DEV_TESTFLIGHT_CONTACT_FIRST_NAME: ${{ secrets.DEV_TESTFLIGHT_CONTACT_FIRST_NAME }}
          DEV_TESTFLIGHT_CONTACT_LAST_NAME: ${{ secrets.DEV_TESTFLIGHT_CONTACT_LAST_NAME }}
          DEV_TESTFLIGHT_CONTACT_EMAIL: ${{ secrets.DEV_TESTFLIGHT_CONTACT_EMAIL }}
          DEV_TESTFLIGHT_CONTACT_PHONE_E164: ${{ secrets.DEV_TESTFLIGHT_CONTACT_PHONE_E164 }}
          DEV_TESTFLIGHT_EXTERNAL_TESTER_EMAIL: ${{ secrets.DEV_TESTFLIGHT_EXTERNAL_TESTER_EMAIL }}
          DEV_TESTFLIGHT_EXTERNAL_TESTER_FIRST_NAME: ${{ secrets.DEV_TESTFLIGHT_EXTERNAL_TESTER_FIRST_NAME }}
          DEV_TESTFLIGHT_EXTERNAL_TESTER_LAST_NAME: ${{ secrets.DEV_TESTFLIGHT_EXTERNAL_TESTER_LAST_NAME }}
          FASTLANE_DISABLE_PTY: 1
          FASTLANE_EXPLICIT_OPEN3: 1
          FASTLANE_DISABLE_COLORS: 1
          CI: 1
        run: |
          cd ios
          fastlane dev

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-ipa-${{ github.run_id }}
          path: ios/build/*.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Redact iOS build logs
        id: redact_ios_build_logs
        if: always()
        run: |
          ruby ios/fastlane/dart_define_log_redaction.rb \
            dart_define/dev_dart_define.json \
            "$HOME/Library/Logs/gym/*.log" \
            "ios/build/logs/**/*.log"

      - name: Show redacted iOS build logs
        if: failure() && steps.redact_ios_build_logs.outcome == 'success'
        run: |
          shopt -s globstar nullglob
          for log in "$HOME"/Library/Logs/gym/*.log ios/build/logs/**/*.log; do
            tail -n 200 "$log"
          done

      - name: Upload build logs
        if: failure() && steps.redact_ios_build_logs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            /Users/runner/Library/Logs/gym/*.log
            ios/build/logs/**/*.log
          retention-days: 7
